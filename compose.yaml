services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://school:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}@db:5432/school"
      APP_ORIGIN: "http://127.0.0.1:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: school
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}"
    volumes:
      - school_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  school_data:
